name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Check formatting
        run: make lint

      - name: Run tests
        run: make test

      - name: Build app bundle
        run: make app
